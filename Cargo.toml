[package]
name = "fence"
version = "0.1.0"
edition = "2024"
description = "A Rust CLI for keeping architectural decisions in sync with code."
license = "MIT"
repository = "https://github.com/prajwolkk/fence"
readme = "README.md"
keywords = ["adr", "architecture", "cli", "git", "ci"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
clap_complete = "4.6.0"
dialoguer = "0.12.0"
dirs = "6.0.0"
globset = "0.4.16"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.8"
ureq = { version = "3.1.2", features = ["json"] }
ratatui = "0.29.0"
crossterm = "0.29.0"
