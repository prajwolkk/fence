name: Fence Sentinel PR Comment

on:
  pull_request:

jobs:
  fence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Fence
        run: |
          curl -fsSL https://github.com/prajwolkk/fence/releases/latest/download/fence-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv fence /usr/local/bin/fence
          fence --version

      - name: Fence Sentinel Check
        id: fence
        shell: bash
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          set +e
          fence sentinel check --base "$BASE" --markdown | tee fence-sentinel.md
          status=${PIPESTATUS[0]}
          cat fence-sentinel.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'body<<EOF'
            cat fence-sentinel.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- fence-sentinel-comment -->'
            const report = ${{ toJSON(steps.fence.outputs.body || 'Fence Sentinel did not produce output.') }}
            const body = `${marker}\n${report}`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number })
            const existing = comments.data.find((comment) => comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

      - name: Enforce Fence result
        if: steps.fence.outputs.status != '0'
        run: exit 1
