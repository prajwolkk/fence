<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">Fence serve web UI</title>
  <desc id="desc">A dashboard-style screenshot of the Fence web UI with summary cards, filters, and decision cards.</desc>
  <rect width="1120" height="680" fill="#f6f7f9"/>
  <text x="56" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#17202a">Fence Decisions</text>
  <text x="56" y="104" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6b7a">Architectural intent, review health, and decision history.</text>
  <rect x="56" y="138" width="184" height="86" rx="8" fill="#fff" stroke="#dfe4ea"/>
  <rect x="256" y="138" width="184" height="86" rx="8" fill="#fff" stroke="#dfe4ea"/>
  <rect x="456" y="138" width="184" height="86" rx="8" fill="#fff" stroke="#dfe4ea"/>
