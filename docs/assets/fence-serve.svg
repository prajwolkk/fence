  <text x="536" y="283" font-family="Inter, Arial, sans-serif" font-size="15" fill="#17202a">Status</text>
  <rect x="664" y="254" width="142" height="46" rx="8" fill="#fff" stroke="#dfe4ea"/>
  <text x="684" y="283" font-family="Inter, Arial, sans-serif" font-size="15" fill="#17202a">Category</text>
  <rect x="822" y="254" width="114" height="46" rx="8" fill="#fff" stroke="#dfe4ea"/>
  <text x="842" y="283" font-family="Inter, Arial, sans-serif" font-size="15" fill="#17202a">Tag</text>
  <rect x="952" y="254" width="112" height="46" rx="8" fill="#fff" stroke="#dfe4ea"/>
  <text x="972" y="283" font-family="Inter, Arial, sans-serif" font-size="15" fill="#17202a">Newest</text>
  <rect x="56" y="334" width="1008" height="142" rx="8" fill="#fff" stroke="#dfe4ea"/>
  <text x="78" y="370" font-family="SFMono-Regular, Consolas, monospace" font-size="14" fill="#17202a">9b0f65dc</text>
  <rect x="166" y="350" width="74" height="28" rx="8" fill="#eef2f6" stroke="#dfe4ea"/>
  <text x="183" y="369" font-family="Inter, Arial, sans-serif" font-size="13" fill="#17202a">Copy ID</text>
  <rect x="254" y="350" width="78" height="28" rx="14" fill="#e9f7f0"/>
  <text x="274" y="369" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f8a5f">Accepted</text>
  <text x="78" y="415" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#17202a">Sentinel CI requires decisions for scored architecture changes</text>
  <text x="78" y="446" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5f6b7a">Fence blocks PRs when meaningful changes land without recorded intent.</text>
  <rect x="56" y="500" width="1008" height="112" rx="8" fill="#fff" stroke="#dfe4ea"/>
  <text x="78" y="544" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#17202a">Structured JSON decision store</text>
  <text x="78" y="574" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5f6b7a">Search, filters, linked supersedes, and review health are served locally.</text>
