  <text x="676" y="170" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5f6b7a">Stale</text>
  <text x="676" y="205" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#b7791f">1</text>
  <text x="876" y="170" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5f6b7a">Deprecated / superseded</text>
  <text x="876" y="205" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#697386">0 / 1</text>
  <rect x="56" y="254" width="444" height="46" rx="8" fill="#fff" stroke="#dfe4ea"/>
  <text x="78" y="283" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5f6b7a">Search decisions</text>
