  <rect x="856" y="138" width="208" height="86" rx="8" fill="#fff" stroke="#dfe4ea"/>
  <text x="76" y="170" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5f6b7a">Total decisions</text>
  <text x="76" y="205" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#17202a">10</text>
